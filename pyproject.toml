[project]
name = "bt-demo"
version = "0.1.0"
description = "Bessemer AI Gateway demo services and agents on WSO2 Agent Manager"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.10.1",
  "mcp==1.12.4",
  "pydantic==2.11.7",
  "langgraph==0.4.8",
  "openai==1.82.0",
  "opentelemetry-api>=1.38.0",
  "opentelemetry-sdk>=1.38.0",
  "opentelemetry-exporter-otlp-proto-http>=1.38.0",
]

[project.optional-dependencies]
agent = ["amp-instrumentation==0.4.1"]
test = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bt"]
